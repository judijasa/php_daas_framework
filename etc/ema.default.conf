; Host-level DEFAULT config consumed by the 'ema' CLI (this framework's DB
; dependency).
;
; One [default] section per host. Unlike reuter.ini (one [<dbname>] section per
; database), this file is host-wide: every instance ema provisions on this host
; reads it, and the value is written into that instance's [mysqld] when the
; instance is provisioned. This committed, tracked default is read as a
; fallback; the optional git-ignored override etc/ema.conf is merged over it
; (an override that defines the key wins — even empty, which clears a default).
;
; ssl-ca is the CA the instance's server verifies CLIENT certificates against —
; the server half of a consumer's `REQUIRE X509` service account (the app-layer
; client half is this framework's SSL_DIR wiring; see
; doc/system/machine-certs.md). Its value is an absolute path on this host
; (typically under the system /etc/ssl), chosen by the operator, who installs
; the CA out of band: ema records the path only and never copies certificate
; bytes. Absent -> no CA (plain TCP); empty in the override -> no CA (clears a
; default); non-empty -> the CA path (must be absolute, and the file must exist
; at `ema create` time). EMA_SSL_CA overrides the key.
;
; Consumers that need a CA (a REQUIRE X509 service account) set the value here
; (as their committed default) or in their etc/ema.conf override on the DB host.
; This framework ships no CA: the consumer owns the trust anchor.
;
; ssl-crl is the CRL the instance's server checks CLIENT certificates against
; (revocation). It mirrors ssl-ca's absent/empty/non-empty resolution, and it
; requires ssl-ca (a CRL with no CA checks nothing). This framework ships no
; CRL either: the consumer owns the trust anchor. EMA_SSL_CRL overrides the
; key. See ema's doc/system/host-ssl-ca.md.

[default]
ssl-ca = /etc/ssl/ca.crt
ssl-crl = /etc/ssl/crl.pem
