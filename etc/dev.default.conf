# Dev machine DEFAULT config — the consumer's local dev values, exported as
# shell and sourced by bin/dev/init-local-env.sh (which relays them into .env)
# and by bin/gen-cert (which reads SSL_DIR).
#
# This file is the committed, tracked default: init-local-env.sh sources it as a
# fallback, so a plain checkout works without any copy step. The optional
# git-ignored override etc/dev.conf carries machine-specific values and is
# sourced after this file (the override wins; it may set a key empty to clear a
# defaulted value). Unlike etc/deploy.conf (deploy-machine-only), both live on
# the DEV machine only and are never shipped to a host.
#
# It holds only non-derived, consumer-chosen dev values; derived values
# (REPO_PATH/REPO_LOG) stay derived by init-local-env.sh and never appear here.
#
# DBUSER: the DB username `ema mariadb <db>` connects as. Absent here and in the
# override -> the mechanism default (the current $USER); present-but-empty -> a
# loud error (a username is required).
# export DBUSER=${DBUSER:-$(whoami)}
#
# SSL_DIR: directory holding the machine's TLS client certificate
# (client.crt + client.key) for REQUIRE X509 service accounts (see
# doc/system/machine-certs.md). Absent or empty -> no client cert (plain TCP);
# non-empty -> must be an absolute path (an unquoted ~ or $HOME is expanded by
# the sourcing shell; a quoted ~ is not, and now fails loudly).
# export SSL_DIR=~/.ssl
