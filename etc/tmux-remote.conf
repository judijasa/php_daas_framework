# tmux-remote — remote session config for a consumer host.
#
# Framework-owned; it ships inside the framework package's etc/ and is read on
# the host by `tmux -f` (see doc/system/tmux-remote.md). Do not edit the copy on
# a host: the deployed repo directory is replaced on every deploy.

# Prefix C-a, never C-b: the operator's local tmux (if any) owns C-b, so the
# remote session must not be reachable through the same key. C-a C-a still
# passes a literal C-a through to readline.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Red status bar: this is a shell on a production host, not a local session.
# status-style is the live option — the legacy status-bg/status-fg still parse
# on modern tmux (3.7 verified) but no longer drive the bar.
set -g status-style "bg=red,fg=white"

# Launch the shell as non-login. tmux's default (empty default-command) starts a
# login shell, and a login shell sources /etc/profile — which hard-resets PATH
# for root and would drop the vendor/bin + nix result/bin that tmux-remote
# exported into the session. A non-login "$SHELL" inherits that PATH untouched.
set -g default-command 'exec "$SHELL"'
